<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Issue: Zagreb Weather Wallpaper</title>
    <meta name="description" content="Live desktop wallpaper: the Zagreb Cathedral seen from an Upper Town terrace under the real sky, weather, moon and seasons of your city, with a weather card. For KDE Plasma 6 and Lively Wallpaper.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="panel.css">
    <!-- deferred: the page paints first, then the script runs (it needs the whole document) -->
    <script src="app.js" defer></script>
</head>
<body>
    <canvas id="weather-canvas" aria-hidden="true"></canvas>
    <canvas id="weather-overlay" aria-hidden="true"></canvas>

    <main id="weather-panel" class="weather-panel">
        <div class="wm-header">
            <span id="wp-title">📍 VREMENSKA PROGNOZA</span>
        </div>
        <div class="wp-current">
            <div class="wp-current-left">
                <span class="wp-city" id="wp-city">Zagreb</span>
                <span class="wp-cond" id="wp-cond">Vedro</span>
                <span class="wp-wind" id="wp-wind" hidden></span>
            </div>
            <div class="wp-current-right">
                <span class="wp-icon" id="wp-icon">☀️</span>
                <span class="wp-temp" id="wp-temp">--°C</span>
            </div>
        </div>
        <div class="wp-soon" id="wp-soon" hidden></div>
        <div class="wm-sun-row" id="wp-sun-row" hidden>
            <span><span class="wm-sun-icon">🌅</span> <span id="wp-sunrise-label">IZLAZAK</span> <b id="wp-sunrise">--:--</b></span>
            <span><span class="wm-sun-icon">🌇</span> <span id="wp-sunset-label">ZALAZAK</span> <b id="wp-sunset">--:--</b></span>
        </div>
        <ul class="wm-forecast-list" id="wp-forecast-list"></ul>
        <div class="wp-update" id="wp-update" hidden></div>
    </main>
</body>
</html>
